services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 4001
      DATABASE_URL: postgresql://${NEW_ERRA_POSTGRES_USER}:${NEW_ERRA_POSTGRES_PASSWORD}@postgres:5432/${NEW_ERRA_POSTGRES_DB}
      JWT_SECRET: ${NEW_ERRA_JWT_SECRET}
      CORS_ORIGIN: ${NEW_ERRA_CORS_ORIGIN}
    ports:
      - "127.0.0.1:${NEW_ERRA_API_PORT:-4011}:4001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4001/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${NEW_ERRA_POSTGRES_DB}
      POSTGRES_USER: ${NEW_ERRA_POSTGRES_USER}
      POSTGRES_PASSWORD: ${NEW_ERRA_POSTGRES_PASSWORD}
    volumes:
      - new_erra_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NEW_ERRA_POSTGRES_USER} -d ${NEW_ERRA_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  new_erra_postgres_data:
